<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="passx.css">
</head>

<body>
    <div class="navbar">
        <div class="title">PASSX</div>
        <div class="details">
            <ul>
                <li>Contact</li>
                <li>About</li>
                <li>Home</li>
            </ul>
        </div>
    </div>

    <div class="container">
        <div class="content">
            <h2>Password Manager</h2>
            <p>We provide a platform to save your important passwords </p>
            <br>
            <br>
            <h3>
                Your Passwords
            </h3>
            <div class="tablediv">
                <table>
                    <tr>
                        <th style="padding: 10px;">Website</th>
                        <th style="padding: 10px;">Username</th>
                        <th style="padding: 10px;">Password</th>
                        <th style="padding: 10px;">Delete</th>
                    </tr>

                    <!-- <tr>
                        <td style="padding: 10px;">facebook</td>
                        <td style="padding: 10px;">ranadhruv@gmail.con/td>
                        <td style="padding: 10px;">iiii</td>
                        <td style="padding: 10px;">
                            <button id="delbtn">Delete</button>
                        </td>
                    </tr> -->
                </table>
            </div>

            <div class="enter">
                <b>Add a password</b>
                <form action="submit" method="post" id="form">
                    <label for="Website" id="Website">Website: </label>
                    <input type="text" id="webinput">
                    <br><br>
                    
                    <label for="Username" id="Username">Username: </label>
                    <input type="text" id="userinput">
                    <br><br>

                    <label for="Password" id="Password">Password: </label>
                    <input type="password" id="passinput"><br><br>

                    <button id="btn">submit</button>
                </form>
            </div>



        </div>
    </div>


    <script src="passx.js"></script>
</body>

</html>
